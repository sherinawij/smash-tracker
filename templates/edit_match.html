{% extends "base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/edit_match.css') }}">
{% endblock %}

{% block content %}
<div class="history-page">

    <div class="match-card {{ match.result }}">
        <p>Player 1: {{ match.player1 }}</p>
        <p>Player 2: {{ match.player2 }}</p>
        <p>Character 1: {{ match.character1 }}</p>
        <p>Character 2: {{ match.character2 }}</p>
        <p>Result: {{ match.result }}</p>
    </div>

    <div class="edit-card">
        <form method="POST">
            <label>Player 1:</label>
            <input type="text" name="player1" value="{{ match.player1 }}">

            <label>Player 2:</label>
            <input type="text" name="player2" value="{{ match.player2 }}">

            <label>Character 1:</label>
            <input type="text" name="character1" value="{{ match.character1 }}">

            <label>Character 2:</label>
            <input type="text" name="character2" value="{{ match.character2 }}">

            <label>Result:</label>
            <select name="result">
                <option value="Win" {% if match.result == 'Win' %}selected{% endif %}>Win</option>
                <option value="Loss" {% if match.result == 'Loss' %}selected{% endif %}>Loss</option>
            </select>

            <button type="submit">Save Changes</button>
        </form>
    </div>

</div>
{% endblock %}
