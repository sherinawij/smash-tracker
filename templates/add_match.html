{% extends "base.html" %}

{% block title %}Add Match{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/add_match.css') }}">
{% endblock %}

{% block content %}
<div class="card">
    <h2>Add Match</h2>

    <form method="POST">
        <label>Player 1:</label>
        <input type="text" name="player1">

        <label>Player 2:</label>
        <input type="text" name="player2">

        <label>Character 1:</label>
        <input type="text" name="character1">

        <label>Character 2:</label>
        <input type="text" name="character2">

        <label>Result:</label>
        <select name="result">
            <option value="Win">Win</option>
            <option value="Loss">Loss</option>
        </select>

        <button type="submit">Add Match</button>
    </form>
</div>
{% endblock %}
