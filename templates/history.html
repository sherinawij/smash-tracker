<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match History</title>
</head>
<body>
<h2>Match History</h2>
{% for match in matches %}
<p>
    Opponent: {{match.opponent}} <br>
    Character: {{match.character}} <br>
    Result: {{match.result}}
</p>
<hr>
{% endfor %}
</body>
</html>
